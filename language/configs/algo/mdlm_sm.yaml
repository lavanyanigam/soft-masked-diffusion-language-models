name: mdlm_sm
backbone: dit  # dit / dimamba / hf_dit
parameterization: subs
time_conditioning: False
T: 0  # 0 (continuous time) / 1000 
subs_masking: False
causal_attention: False
ignore_bos: False
loss_type: elbo
tran_head:
  init_scale: 0.0
  init_centre: -0.75
  init_steep: 6.66
  init_temperature: 1.0
  mixinputs_k : 3
  # mixinputs_with_topk / mixinputs_with_temp / slerp_sm / slerp_euclid_mean / lerp_renorm
  # slerp_euclid_mean == slerp_sm but with the normalised Euclidean (LERP) mean
  # of the top-k embeddings in place of the Frechet mean; the blend is identical.
  transparency_alg: mixinputs_with_topk
  # Number of Frechet-mean (Karcher) iterations used by slerp_sm
  slerp_n_iter: 3
  # Whether the transparency-head parameters should be trainable.
  learnable: true
  # Optional fixed lambda override in [0, 1]. null keeps the learned schedule.
  fixed_lambda: null
  # Reliability-conditioned schedule config
  reliability_conditioned: false
  reliability_beta: 0.99
  reliability_start: 0.05
  reliability_full: 0.25

